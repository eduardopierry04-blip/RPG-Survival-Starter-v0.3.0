
name: Compilar RPG Survival

on:
  workflow_dispatch:
  push:
    paths:
      - 'RPG-Survival-Starter-v0.3.0.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p extraido
          unzip -q RPG-Survival-Starter-v0.3.0.zip -d extraido
          POM="$(find extraido -name pom.xml -print -quit)"
          if [ -z "$POM" ]; then
            echo "ERRO: Não encontrei pom.xml dentro do ZIP."
            echo "Arquivos encontrados:"
            find extraido -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Compilar plugin
        run: |
          cd "$PROJECT_DIR"
          mvn --batch-mode clean package

      - name: Disponibilizar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Survival-JAR
          path: '**/target/*.jar'
          if-no-files-found: error
          
          
